name: Release
on:
  push:
    branches: [main]
    paths: [package.json, 'releases/**', tools/publish-release.mjs, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seekdeck-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'Xenoah/seekdeck-webdj' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm test
      - run: npm run check
      - name: Install pinned browser test tooling
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser integration check
        run: node tests/browser/smoke.mjs
      - name: Save browser verification images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-verification
          path: test-results
          retention-days: 7
      - run: python3 tools/package-release.py
      - name: Publish version from package.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/publish-release.mjs
